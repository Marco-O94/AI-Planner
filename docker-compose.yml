name: project-notes

# Phase 1: data services only. backend / mcp / frontend are added in their
# respective phases (culminating in Phase 6 orchestration).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectnotes}
      POSTGRES_USER: ${POSTGRES_USER:-projectnotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectnotes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectnotes} -d ${POSTGRES_DB:-projectnotes}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pnnet

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # qdrant image ships bash but no curl/wget; probe the HTTP port via /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pnnet

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-projectnotes}:${POSTGRES_PASSWORD:-projectnotes}@postgres:5432/${POSTGRES_DB:-projectnotes}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DIR: /data/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - docstore:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pnnet

  mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      MCP_TRANSPORT: ${MCP_TRANSPORT:-sse}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8050
    ports:
      - "${MCP_PORT:-8050}:8050"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pnnet

volumes:
  pgdata:
  qdrantdata:
  docstore:

networks:
  pnnet:
    driver: bridge
